version: '3.8'

services:
  db:
    image: postgres:17
    container_name: ayzek_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: emrullah2456
      POSTGRES_DB: ayzek_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  ayzek-backend:
    build: ./BACKEND
    container_name: ayzek_backend_cont
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:emrullah2456@db:5432/ayzek_db
      ALLOWED_ORIGINS: "https://ayzek.tr, https://api.ayzek.tr"
      JWT_SECRET_KEY: n10Gk-fDq7R3L2pQc_jH8sX4wV9bY6aE-tZ5uI8oP2rS1mC7
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    env_file:
      - .env
    volumes:
      # Yüklenen orijinal resimler kaybolmasın diye:
      - ./BACKEND/public/uploads:/app/public/uploads
    ports:
      - "8000:8000"
    restart: always

  ayzek-frontend:
    build: ./FRONTEND
    container_name: ayzek_frontend_cont
    ports:
      - "3000:3000"
    depends_on:
      - ayzek-backend
    environment:
      NEXT_PUBLIC_API_URL: "https://api.ayzek.tr"
      NEXT_PUBLIC_BACKEND_URL: "https://api.ayzek.tr"
    volumes:
      # 👇 İŞTE HIZI SAĞLAYACAK OLAN EKLENTİ BU! 👇
      # Next.js'in oluşturduğu cache ve optimize resimler silinmeyecek.
      - nextjs_cache:/app/.next/cache
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ayzek_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - ayzek-frontend
      - ayzek-backend
    restart: always

volumes:
  postgres_data:
  # 👇 BUNU DA EKLEMELİSİN
  nextjs_cache:
